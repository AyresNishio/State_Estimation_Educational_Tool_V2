version: '3.8'

services:
  dash-app:
    build: 
      context: .
      dockerfile: Dockerfile
    ports:
      - "8050:8050"
    environment:
      - PYTHONPATH=/app
      - DASH_DEBUG=False
    volumes:
      # For development, mount source code
      - .:/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8050/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  # Optional: Add Redis for caching (if needed)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

volumes:
  redis_data:
